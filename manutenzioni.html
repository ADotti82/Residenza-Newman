<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residenza Newman - Gestione Manutenzioni</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; color: #333; }
        .card-hover:hover { transform: translateY(-3px); transition: all 0.2s ease-in-out; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1); }
        @media print {
            .no-print { display: none !important; }
            .card { border: 1px solid #ccc !important; break-inside: avoid; box-shadow: none !important; }
            body { background: white !important; }
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center flex-wrap no-print">
            <div>
                <h1 class="h3 mb-0 text-primary fw-bold"><i class="fa-solid fa-screwdriver-wrench me-2"></i>Residenza Newman</h1>
                <p class="text-muted mb-0">Registro Amministrazione - Manutenzioni (Tempo Reale via API)</p>
            </div>
            <div class="mt-2 mt-md-0">
                <button class="btn btn-outline-secondary me-2" onclick="caricaDatiLive()"><i class="fa-solid fa-sync me-1"></i> Aggiorna</button>
                <button class="btn btn-outline-secondary me-2" onclick="window.print()"><i class="fa-solid fa-print me-1"></i> Stampa</button>
                <button class="btn btn-primary" onclick="inviaElencoEmail()"><i class="fa-solid fa-envelope me-1"></i> Invia Elenco via Email</button>
            </div>
        </header>

        <div class="row mb-4 no-print">
            <div class="col-md-6 mb-2">
                <input type="text" id="searchInput" class="form-control" placeholder="Cerca per luogo, descrizione o ID..." onkeyup="filtraDati()">
            </div>
            <div class="col-md-3 mb-2">
                <select id="filterStato" class="form-select" onchange="filtraDati()">
                    <option value="">Tutti gli stati</option>
                    <option value="Da fare">Da fare</option>
                    <option value="In corso">In corso</option>
                    <option value="Completato">Completato</option>
                </select>
            </div>
            <div class="col-md-3 mb-2 d-flex justify-content-end">
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="viewMode" id="viewCards" autocomplete="off" checked onclick="cambiaVista('cards')">
                    <label class="btn btn-outline-primary" for="viewCards"><i class="fa-solid fa-grip me-1"></i> Schede</label>
                    
                    <input type="radio" class="btn-check" name="viewMode" id="viewTable" autocomplete="off" onclick="cambiaVista('table')">
                    <label class="btn btn-outline-primary" for="viewTable"><i class="fa-solid fa-table me-1"></i> Tabella</label>
                </div>
            </div>
        </div>

        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Caricamento in corso...</span>
            </div>
            <p class="text-muted mt-2">Connessione al server in corso...</p>
        </div>

        <div id="cardsView" class="row d-none"></div>

        <div id="tableView" class="table-responsive d-none">
            <table class="table table-striped table-hover bg-white rounded shadow-sm">
                <thead class="table-dark">
                    <tr>
                        <th>ID / Data</th>
                        <th>Luogo</th>
                        <th>Categoria</th>
                        <th>Descrizione</th>
                        <th>Priorità</th>
                        <th>Stato</th>
                        <th class="no-print text-end">Azioni</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbys9aPfUH6PXGCmHPDWset6pgvwG1kmxUlDFv3Yaiq8uAfp_2uiswm7DNd8_tQqDHHxVg/exec';

        let manutenzioniData = [];
        let filteredData = [];

        async function caricaDatiLive() {
            try {
                document.getElementById('loading').classList.remove('d-none');
                const response = await fetch(WEB_APP_URL);
                if (!response.ok) throw new Error('Errore di rete.');
                
                const data = await response.json();
                
                if (!Array.isArray(data)) {
                    throw new Error(data.error || "Formato dati non valido ricevuto dal server.");
                }
                
                manutenzioniData = data;
                filteredData = [...manutenzioniData];
                
                document.getElementById('loading').classList.add('d-none');
                cambiaVista(document.getElementById('viewCards').checked ? 'cards' : 'table');
                render();
            } catch (err) {
                document.getElementById('loading').innerHTML = `<div class="alert alert-danger">Impossibile caricare i dati: ${err.message}</div>`;
            }
        }

        function render() {
            renderCards();
            renderTable();
        }

        function renderCards() {
            const container = document.getElementById('cardsView');
            container.innerHTML = '';
            if (filteredData.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-4">Nessuna richiesta trovata.</div>';
                return;
            }
            filteredData.forEach(item => {
                let stato = item.Stato ? String(item.Stato).trim() : 'Da fare';
                let badgeClass = stato === 'Da fare' ? 'bg-danger' : (stato === 'In corso' ? 'bg-warning text-dark' : 'bg-success');
                let fotoBtn = item.Link_Foto && String(item.Link_Foto).trim() !== '' ? `<a href="${item.Link_Foto}" target="_blank" class="btn btn-sm btn-outline-primary mb-2"><i class="fa-solid fa-image me-1"></i> Visualizza Foto</a>` : '';
                
                let col = document.createElement('div');
                col.className = 'col-md-4 mb-3';
                col.innerHTML = `
                    <div class="card h-100 card-hover shadow-sm">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge ${badgeClass}">${stato}</span>
                                <small class="text-muted">${item.Timestamp ? new Date(item.Timestamp).toLocaleString('it-IT') : ''}</small>
                            </div>
                            <h5 class="card-title text-dark"><i class="fa-solid fa-location-dot me-1 text-danger"></i> ${item.Luogo || ''}</h5>
                            <h6 class="card-subtitle mb-2 text-muted text-uppercase small">${item.Categoria || ''} | Priorità: ${item.Priorita || ''}</h6>
                            <p class="card-text flex-grow-1 mt-2">${item.Descrizione || ''}</p>
                            ${fotoBtn}
                            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top no-print">
                                <small class="text-muted text-truncate" style="max-width: 150px;" title="${item.Email || ''}">${item.Email || ''}</small>
                                <div>
                                    <button class="btn btn-sm btn-outline-secondary" onclick="stampaScheda('${item.ID}')" title="Stampa"><i class="fa-solid fa-print"></i></button>
                                    <button class="btn btn-sm btn-outline-primary" onclick="inviaSingolaEmail('${item.ID}')" title="Invia Email"><i class="fa-solid fa-envelope"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Nessuna richiesta trovata.</td></tr>';
                return;
            }
            filteredData.forEach(item => {
                let stato = item.Stato ? String(item.Stato).trim() : 'Da fare';
                let badgeClass = stato === 'Da fare' ? 'bg-danger' : (stato === 'In corso' ? 'bg-warning text-dark' : 'bg-success');
                let fotoLink = item.Link_Foto && String(item.Link_Foto).trim() !== '' ? `<a href="${item.Link_Foto}" target="_blank" class="ms-1" title="Foto"><i class="fa-solid fa-image"></i></a>` : '';
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><small class="fw-bold">${item.ID || ''}</small><br><small class="text-muted">${item.Timestamp ? new Date(item.Timestamp).toLocaleString('it-IT') : ''}</small></td>
                    <td>${item.Luogo || ''}</td>
                    <td><span class="badge bg-secondary">${item.Categoria || ''}</span></td>
                    <td>${item.Descrizione || ''} ${fotoLink}</td>
                    <td>${item.Priorita || ''}</td>
                    <td><span class="badge ${badgeClass}">${stato}</span></td>
                    <td class="no-print text-end">
                        <button class="btn btn-sm btn-outline-secondary me-1" onclick="stampaScheda('${item.ID}')"><i class="fa-solid fa-print"></i></button>
                        <button class="btn btn-sm btn-outline-primary" onclick="inviaSingolaEmail('${item.ID}')"><i class="fa-solid fa-envelope"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function cambiaVista(modo) {
            if (modo === 'cards') {
                document.getElementById('cardsView').classList.remove('d-none');
                document.getElementById('tableView').classList.add('d-none');
            } else {
                document.getElementById('cardsView').classList.add('d-none');
                document.getElementById('tableView').classList.remove('d-none');
            }
        }

        function filtraDati() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const stato = document.getElementById('filterStato').value;
            filteredData = manutenzioniData.filter(item => {
                const luogo = item.Luogo ? String(item.Luogo).toLowerCase() : '';
                const desc = item.Descrizione ? String(item.Descrizione).toLowerCase() : '';
                const id = item.ID ? String(item.ID).toLowerCase() : '';
                const itemStato = item.Stato ? String(item.Stato).trim() : '';

                const matchQuery = luogo.includes(query) || desc.includes(query) || id.includes(query);
                const matchStato = stato === "" || itemStato === stato;
                return matchQuery && matchStato;
            });
            render();
        }

        function stampaScheda(id) {
            const item = manutenzioniData.find(i => i.ID === id);
            if (!item) return;
            let w = window.open('', '_blank');
            w.document.write(`
                <html>
                <head>
                    <title>Richiesta ${item.ID}</title>
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
                </head>
                <body class="p-5">
                    <h2>Residenza Newman - Scheda Manutenzione</h2>
                    <hr>
                    <p><strong>ID:</strong> ${item.ID}</p>
                    <p><strong>Data:</strong> ${item.Timestamp ? new Date(item.Timestamp).toLocaleString('it-IT') : ''}</p>
                    <p><strong>Luogo:</strong> ${item.Luogo}</p>
                    <p><strong>Categoria:</strong> ${item.Categoria}</p>
                    <p><strong>Priorità:</strong> ${item.Priorita}</p>
                    <p><strong>Stato:</strong> ${item.Stato}</p>
                    <p><strong>Segnalato da:</strong> ${item.Email}</p>
                    <p><strong>Descrizione:</strong> ${item.Descrizione}</p>
                    ${item.Link_Foto ? `<p><strong>Foto:</strong> <a href="${item.Link_Foto}" target="_blank">Visualizza Allegato</a></p>` : ''}
                    <script>window.print();<\/script>
                </body>
                </html>
            `);
            w.document.close();
        }

        function inviaSingolaEmail(id) {
            const item = manutenzioniData.find(i => i.ID === id);
            if (!item) return;
            const subject = encodeURIComponent(`Manutenzione Residenza Newman: ${item.ID} - ${item.Luogo}`);
            const body = encodeURIComponent(`Dettagli richiesta di manutenzione:\n\nID: ${item.ID}\nData: ${item.Timestamp}\nLuogo: ${item.Luogo}\nCategoria: ${item.Categoria}\nPriorità: ${item.Priorita}\nStato: ${item.Stato}\nSegnalato da: ${item.Email}\nDescrizione: ${item.Descrizione}\nFoto: ${item.Link_Foto || 'Nessuna'}`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function inviaElencoEmail() {
            let bodyText = "Elenco Richieste di Manutenzione - Residenza Newman:\n\n";
            filteredData.forEach((item, index) => {
                bodyText += `${index + 1}. [${item.Stato}] ${item.Luogo} - ${item.Descrizione} (${item.Categoria})\n`;
            });
            const subject = encodeURIComponent("Riepilogo Manutenzioni Residenza Newman");
            const body = encodeURIComponent(bodyText);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        caricaDatiLive();
    </script>
</body>
</html>
