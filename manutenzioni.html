<script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbys9aPfUH6PXGCmHPDWset6pgvwG1kmxUlDFv3Yaiq8uAfp_2uiswm7DNd8_tQqDHHxVg/exec';

        let manutenzioniData = [];
        let filteredData = [];

        async function caricaDatiLive() {
            try {
                document.getElementById('loading').classList.remove('d-none');
                
                // Inviamo una richiesta POST per interrogare correttamente il backend esistente
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'getMasterData',
                        email: 'donandreadotti@gmail.com'
                    })
                });
                
                if (!response.ok) throw new Error('Errore di rete.');
                
                const data = await response.json();
                
                let arrayData = [];
                if (Array.isArray(data)) {
                    arrayData = data;
                } else if (data && typeof data === 'object') {
                    if (Array.isArray(data.guasti)) arrayData = data.guasti;
                    else if (Array.isArray(data.manutenzione)) arrayData = data.manutenzione;
                    else {
                        const foundKey = Object.keys(data).find(k => Array.isArray(data[k]));
                        if (foundKey) arrayData = data[foundKey];
                    }
                }
                
                if (!Array.isArray(arrayData)) {
                    throw new Error(data.error || "Impossibile estrarre l'elenco delle manutenzioni dalla risposta del server.");
                }
                
                manutenzioniData = arrayData;
                filteredData = [...manutenzioniData];
                
                document.getElementById('loading').classList.add('d-none');
                cambiaVista(document.getElementById('viewCards').checked ? 'cards' : 'table');
                render();
            } catch (err) {
                document.getElementById('loading').innerHTML = `<div class="alert alert-danger">Impossibile caricare i dati: ${err.message}</div>`;
            }
        }

        function render() {
            renderCards();
            renderTable();
        }

        function renderCards() {
            const container = document.getElementById('cardsView');
            container.innerHTML = '';
            if (filteredData.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-4">Nessuna richiesta trovata.</div>';
                return;
            }
            filteredData.forEach(item => {
                let stato = item.Stato || item.stato ? String(item.Stato || item.stato).trim() : 'Da fare';
                let badgeClass = stato === 'Da fare' ? 'bg-danger' : (stato === 'In corso' ? 'bg-warning text-dark' : 'bg-success');
                let linkFoto = item.Link_Foto || item.link_foto || '';
                let fotoBtn = linkFoto.trim() !== '' ? `<a href="${linkFoto}" target="_blank" class="btn btn-sm btn-outline-primary mb-2"><i class="fa-solid fa-image me-1"></i> Visualizza Foto</a>` : '';
                
                let col = document.createElement('div');
                col.className = 'col-md-4 mb-3';
                col.innerHTML = `
                    <div class="card h-100 card-hover shadow-sm">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="badge ${badgeClass}">${stato}</span>
                                <small class="text-muted">${item.Timestamp || item.timestamp ? new Date(item.Timestamp || item.timestamp).toLocaleString('it-IT') : ''}</small>
                            </div>
                            <h5 class="card-title text-dark"><i class="fa-solid fa-location-dot me-1 text-danger"></i> ${item.Luogo || item.luogo || ''}</h5>
                            <h6 class="card-subtitle mb-2 text-muted text-uppercase small">${item.Categoria || item.categoria || ''} | Priorità: ${item.Priorita || item.priorita || ''}</h6>
                            <p class="card-text flex-grow-1 mt-2">${item.Descrizione || item.descrizione || ''}</p>
                            ${fotoBtn}
                            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top no-print">
                                <small class="text-muted text-truncate" style="max-width: 150px;" title="${item.Email || item.email || ''}">${item.Email || item.email || ''}</small>
                                <div>
                                    <button class="btn btn-sm btn-outline-secondary" onclick="stampaScheda('${item.ID || item.id}')" title="Stampa"><i class="fa-solid fa-print"></i></button>
                                    <button class="btn btn-sm btn-outline-primary" onclick="inviaSingolaEmail('${item.ID || item.id}')" title="Invia Email"><i class="fa-solid fa-envelope"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(col);
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Nessuna richiesta trovata.</td></tr>';
                return;
            }
            filteredData.forEach(item => {
                let stato = item.Stato || item.stato ? String(item.Stato || item.stato).trim() : 'Da fare';
                let badgeClass = stato === 'Da fare' ? 'bg-danger' : (stato === 'In corso' ? 'bg-warning text-dark' : 'bg-success');
                let linkFoto = item.Link_Foto || item.link_foto || '';
                let fotoLink = linkFoto.trim() !== '' ? `<a href="${linkFoto}" target="_blank" class="ms-1" title="Foto"><i class="fa-solid fa-image"></i></a>` : '';
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><small class="fw-bold">${item.ID || item.id || ''}</small><br><small class="text-muted">${item.Timestamp || item.timestamp ? new Date(item.Timestamp || item.timestamp).toLocaleString('it-IT') : ''}</small></td>
                    <td>${item.Luogo || item.luogo || ''}</td>
                    <td><span class="badge bg-secondary">${item.Categoria || item.categoria || ''}</span></td>
                    <td>${item.Descrizione || item.descrizione || ''} ${fotoLink}</td>
                    <td>${item.Priorita || item.priorita || ''}</td>
                    <td><span class="badge ${badgeClass}">${stato}</span></td>
                    <td class="no-print text-end">
                        <button class="btn btn-sm btn-outline-secondary me-1" onclick="stampaScheda('${item.ID || item.id}')"><i class="fa-solid fa-print"></i></button>
                        <button class="btn btn-sm btn-outline-primary" onclick="inviaSingolaEmail('${item.ID || item.id}')"><i class="fa-solid fa-envelope"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function cambiaVista(modo) {
            if (modo === 'cards') {
                document.getElementById('cardsView').classList.remove('d-none');
                document.getElementById('tableView').classList.add('d-none');
            } else {
                document.getElementById('cardsView').classList.add('d-none');
                document.getElementById('tableView').classList.remove('d-none');
            }
        }

        function filtraDati() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const stato = document.getElementById('filterStato').value;
            filteredData = manutenzioniData.filter(item => {
                const luogo = item.Luogo || item.luogo ? String(item.Luogo || item.luogo).toLowerCase() : '';
                const desc = item.Descrizione || item.descrizione ? String(item.Descrizione || item.descrizione).toLowerCase() : '';
                const id = item.ID || item.id ? String(item.ID || item.id).toLowerCase() : '';
                const itemStato = item.Stato || item.stato ? String(item.Stato || item.stato).trim() : '';

                const matchQuery = luogo.includes(query) || desc.includes(query) || id.includes(query);
                const matchStato = stato === "" || itemStato === stato;
                return matchQuery && matchStato;
            });
            render();
        }

        function stampaScheda(id) {
            const item = manutenzioniData.find(i => String(i.ID || i.id) === String(id));
            if (!item) return;
            let w = window.open('', '_blank');
            w.document.write(`
                <html>
                <head>
                    <title>Richiesta ${item.ID || item.id}</title>
                    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
                </head>
                <body class="p-5">
                    <h2>Residenza Newman - Scheda Manutenzione</h2>
                    <hr>
                    <p><strong>ID:</strong> ${item.ID || item.id}</p>
                    <p><strong>Data:</strong> ${item.Timestamp || item.timestamp ? new Date(item.Timestamp || item.timestamp).toLocaleString('it-IT') : ''}</p>
                    <p><strong>Luogo:</strong> ${item.Luogo || item.luogo}</p>
                    <p><strong>Categoria:</strong> ${item.Categoria || item.categoria}</p>
                    <p><strong>Priorità:</strong> ${item.Priorita || item.priorita}</p>
                    <p><strong>Stato:</strong> ${item.Stato || item.stato}</p>
                    <p><strong>Segnalato da:</strong> ${item.Email || item.email}</p>
                    <p><strong>Descrizione:</strong> ${item.Descrizione || item.descrizione}</p>
                    ${item.Link_Foto || item.link_foto ? `<p><strong>Foto:</strong> <a href="${item.Link_Foto || item.link_foto}" target="_blank">Visualizza Allegato</a></p>` : ''}
                    <script>window.print();<\/script>
                </body>
                </html>
            `);
            w.document.close();
        }

        function inviaSingolaEmail(id) {
            const item = manutenzioniData.find(i => String(i.ID || i.id) === String(id));
            if (!item) return;
            const itemId = item.ID || item.id;
            const itemLuogo = item.Luogo || item.luogo;
            const itemEmail = item.Email || item.email;
            const itemDesc = item.Descrizione || item.descrizione;
            const itemFoto = item.Link_Foto || item.link_foto || 'Nessuna';
            const subject = encodeURIComponent(`Manutenzione Residenza Newman: ${itemId} - ${itemLuogo}`);
            const body = encodeURIComponent(`Dettagli richiesta di manutenzione:\n\nID: ${itemId}\nData: ${item.Timestamp || item.timestamp}\nLuogo: ${itemLuogo}\nCategoria: ${item.Categoria || item.categoria}\nPriorità: ${item.Priorita || item.priorita}\nStato: ${item.Stato || item.stato}\nSegnalato da: ${itemEmail}\nDescrizione: ${itemDesc}\nFoto: ${itemFoto}`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function inviaElencoEmail() {
            let bodyText = "Elenco Richieste di Manutenzione - Residenza Newman:\n\n";
            filteredData.forEach((item, index) => {
                let st = item.Stato || item.stato || 'Da fare';
                let lg = item.Luogo || item.luogo || '';
                let ds = item.Descrizione || item.descrizione || '';
                let cat = item.Categoria || item.categoria || '';
                bodyText += `${index + 1}. [${st}] ${lg} - ${ds} (${cat})\n`;
            });
            const subject = encodeURIComponent("Riepilogo Manutenzioni Residenza Newman");
            const body = encodeURIComponent(bodyText);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        caricaDatiLive();
    </script>
